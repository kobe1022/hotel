info:
  name: Gast 30 mit alter Versionsnummer ändern
  type: http
  seq: 4

http:
  method: PUT
  url: "{{restUrl}}/:id"
  headers:
    - name: If-Match
      value: '"-1"'
  params:
    - name: id
      value: "30"
      type: path
  body:
    type: json
    data: |-
      {
          "vorname": "Jonas",
          "nachname": "Brandt",
          "email": "jonas.brandt@acme.de",
          "treuestufe": 9,
          "has_newsletter": false,
          "geburtsdatum": "2022-01-09",
          "homepage": "https://www.brandt.de"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "412"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
