info:
  name: Neuer Gast mit bereits existierender Email
  type: http
  seq: 2

http:
  method: POST
  url: "{{restUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    type: json
    data: |-
      {
          "vorname": "Vornamenachnamerest",
          "nachname": "Nachnamerest",
          "email": "alice@acme.de",
          "treuestufe": 1,
          "has_newsletter": true,
          "geburtsdatum": "2022-02-01",
          "homepage": "https://test.rest",
          "adresse": {
              "plz": "99999",
              "ort": "Restort"
          },
          "buchungen": [
              {
                  "betrag": "999.99",
                  "waehrung": "EUR",
                  "zimmerkategorie": "DZ",
                  "verpflegung": "F",
                  "zahlungsart": "K",
                  "anreise": "2026-01-10",
                  "abreise": "2026-01-12",
                  "anzahl_gaeste": 2
              }
          ],
          "username": "emailexists"
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.detail
      operator: contains
      value: Email

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
