# Mit z.B. "Bun" extrahieren:
#   $env:NODE_TLS_REJECT_UNAUTHORIZED='0'
#   bunx get-graphql-schema https://localhost:8000/graphql > schema.graphql

schema {
  query: Query
  mutation: Mutation
}

"Suche nach Gastdaten"
type Query {
  "Suche Gastdaten anhand der ID"
  gast(gastId: ID!): Gast

  "Suche Gastdaten anhand des Nachnamens oder der Emailadresse"
  gaeste(suchparameter: Suchparameter): [Gast!]!
}

type Mutation {
  "Einen neuen Gastdatensatz anlegen"
  create(gastInput: GastInput!): CreatePayload!

  "Token zu Benutzername und Passwort anfordern"
  login(username: String!, password: String!): LoginResult!
}

# https://spec.graphql.org/draft/#sec-Types
# https://www.graphql-scalars.dev/docs/scalars/email-address
# https://www.graphql-scalars.dev/docs/scalars/local-date
# https://www.graphql-scalars.dev/docs/scalars/currency
# enum als String, damit toSting() vom Enum-Wert aufgerufen wird
"Eigenschaften eines Gast-Datensatzes mit untergeordneten Eigenschaften"
type Gast {
  id: Int!
  version: Int!
  vorname: String!
  nachname: String!
  email: String!
  treuestufe: Int!
  hasNewsletter: Boolean!
  geburtsdatum: Date!
  homepage: String
  username: String
  adresse: Adresse!
}

type Adresse {
  plz: String!
  ort: String!
}

# https://spec.graphql.org/draft/#sec-Input-Objects
"Suchparameter für die Query 'gaeste'"
input Suchparameter {
  nachname: String = null
  email: String = null
}

input GastInput {
  vorname: String!
  nachname: String!
  email: String!
  treuestufe: Int!
  hasNewsletter: Boolean!
  geburtsdatum: Date!
  homepage: String
  adresse: AdresseInput!
  buchungen: [BuchungInput!]!
  username: String!
}

enum Zimmerkategorie {
  EINZELZIMMER
  DOPPELZIMMER
  FAMILIENZIMMER
  JUNIOR_SUITE
  SUITE
  PRESIDENTIAL_SUITE
}

enum Verpflegung {
  UEBERNACHTUNG
  FRUEHSTUECK
  HALBPENSION
  VOLLPENSION
  ALL_INCLUSIVE
}

enum Zahlungsart {
  KREDITKARTE
  BAR
  UEBERWEISUNG
  PAYPAL
}

input AdresseInput {
  plz: String!
  ort: String!
}

input BuchungInput {
  betrag: Decimal!
  waehrung: String!
  zimmerkategorie: Zimmerkategorie!
  verpflegung: Verpflegung!
  zahlungsart: Zahlungsart!
  anreise: Date!
  abreise: Date!
  anzahlGaeste: Int!
}

type CreatePayload {
  id: Int!
}

type LoginResult {
  token: String!
  expiresIn: String!
  roles: [String!]!
}
